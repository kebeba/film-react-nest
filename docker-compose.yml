networks:
  films-network:
    name: films-service-network

volumes:
  postgres_data:
    name: films-postgres-data
  pgadmin_data:
    name: films-pgadmin-data
  frontend_dist:
    name: films-frontend-dist

services:
  postgres:
    image: postgres:15-alpine
    container_name: films-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - films-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - films-network
    depends_on:
      - postgres

  backend:
    build: ./backend
    image: ghcr.io/kebeba/film-react-nest-backend:latest
    container_name: films-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    networks:
      - films-network
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    image: ghcr.io/kebeba/film-react-nest-frontend:latest
    container_name: films-frontend
    volumes:
      - frontend_dist:/app/dist
    networks:
      - films-network

  nginx:
    build: ./nginx
    image: ghcr.io/kebeba/film-react-nest-nginx:latest
    container_name: films-nginx
    restart: unless-stopped   
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - films-network
    depends_on:
      - backend
