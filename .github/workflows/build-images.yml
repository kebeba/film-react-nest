name: Push Docker images

on:
  push:
    branches:
      - main
      - rewiew-3

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TAG_BACKEND: ${{ github.repository }}-backend
  TAG_FRONTEND: ${{ github.repository }}-frontend
  TAG_NGINX: ${{ github.repository }}-nginx

jobs:
  build-project:
    name: Build Docker images for project
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Docker BuildX setup
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry Autorization
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.TAG_FRONTEND }}:latest
      
      - name: Push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.TAG_BACKEND }}:latest

      - name: Push nginx image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.TAG_NGINX }}:latest

